plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // 如果你使用了 Kotlin 序列化（用于解析 JSON），需要加上这行
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
}

android {
    namespace "com.example.litert"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.litert"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // --- 关键配置：防止模型被压缩 ---
    androidResources {
        noCompress 'litertlm', 'tflite'
    }
    // 兼容旧版 gradle 的写法（建议都加上）
    aaptOptions {
        noCompress "litertlm", "tflite"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true // 方便你在 MainActivity 更新 UI
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    // --- LiteRT (Google AI Edge) 核心依赖 ---
    implementation 'com.google.ai.edge.litert:litert-genai:1.2.0'
    
    // --- Ktor 服务端依赖 (用于给 OpenClaw 提供 HTTP 接口) ---
    def ktor_version = "2.3.10"
    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    
    // 协程支持
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
}
