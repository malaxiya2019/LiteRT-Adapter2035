plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // 必须：版本已在根目录定义，这里不需要写 version
    id 'org.jetbrains.kotlin.plugin.serialization' 
}

android {
    namespace "com.example.litert"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.litert"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // --- 核心：防止 Gemma 模型被压缩，否则 LiteRT 加载会报错 ---
    androidResources {
        noCompress 'litertlm', 'tflite'
    }
    
    aaptOptions {
        noCompress "litertlm", "tflite"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // 基础库（版本建议与 Kotlin 插件 1.9.22 匹配）
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    // --- Google AI Edge (LiteRT) 核心 ---
    implementation 'com.google.ai.edge.litert:litert-genai:1.2.0'
    
    // --- Ktor 本地服务端 (OpenAI 协议中转) ---
    def ktor_version = "2.3.10"
    implementation "io.ktor:ktor-server-core:$ktor_version"
    implementation "io.ktor:ktor-server-netty:$ktor_version"
    implementation "io.ktor:ktor-server-content-negotiation:$ktor_version"
    implementation "io.ktor:ktor-serialization-kotlinx-json:$ktor_version"
    
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

