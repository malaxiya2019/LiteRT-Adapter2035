name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout
      uses: actions/checkout@v4

    # 2. 设置 Java 环境 (包含 Gradle 缓存)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    # 3. 核心修复步骤：处理换行符并赋予执行权限
    # 这一步能解决 "Exec format error" 和 "Permission denied"
    - name: Fix Script and Grant Permission
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew

    # 4. 执行编译
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 5. 上传生成的 APK 文件
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # 使用通配符 *.apk 避免文件名不一致导致上传失败
        path: app/build/outputs/apk/debug/*.apk
