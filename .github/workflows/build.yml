name: Build LiteRT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17（必须固定）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. 缓存 Gradle
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # 4. 权限修复（关键）
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. 验证 wrapper
      - name: Check Gradle Wrapper
        run: ./gradlew --version

      # 6. 构建 APK
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lite-rt-apk
          path: app/build/outputs/apk/debug/*.apk
