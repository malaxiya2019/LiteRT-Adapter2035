- name: Create Gradle Wrapper 8.2 (Alternative)
  run: |
    mkdir -p gradle/wrapper
    
    # 从 Maven Central 下载官方 gradle-wrapper JAR
    curl -L https://repo1.maven.org/maven2/org/gradle/gradle-wrapper/8.2/gradle-wrapper-8.2.jar -o gradle/wrapper/gradle-wrapper.jar
    
    # 验证 JAR
    echo "=== JAR size ==="
    ls -lh gradle/wrapper/gradle-wrapper.jar
    echo "=== Manifest content ==="
    unzip -p gradle/wrapper/gradle-wrapper.jar META-INF/MANIFEST.MF
    
    # 创建配置文件
    cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
    distributionBase=GRADLE_USER_HOME
    distributionPath=wrapper/dists
    distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
    zipStoreBase=GRADLE_USER_HOME
    zipStorePath=wrapper/dists
    EOF
    
    # 创建脚本
    cat > gradlew << 'EOF'
    #!/usr/bin/env sh
    exec java -jar "$(dirname "$0")/gradle/wrapper/gradle-wrapper.jar" "$@"
    EOF
    chmod +x gradlew
    
    # 测试
    ./gradlew --version
