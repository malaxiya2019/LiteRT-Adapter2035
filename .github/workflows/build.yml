name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        lfs: true

    - name: Debug gradle-wrapper.jar
      run: |
        echo "=== File details ==="
        ls -la gradle/wrapper/gradle-wrapper.jar
        echo "=== File type ==="
        file gradle/wrapper/gradle-wrapper.jar
        echo "=== Check if it's an LFS pointer ==="
        head -5 gradle/wrapper/gradle-wrapper.jar
        echo "=== Test JAR integrity ==="
        unzip -t gradle/wrapper/gradle-wrapper.jar 2>&1 | head -5 || echo "JAR is corrupted"

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Fix or regenerate wrapper
      run: |
        sed -i 's/\r$//' gradlew
        chmod +x gradlew
        
        # 检查 JAR 是否有效
        if unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
          echo "=== gradle-wrapper.jar is valid ==="
        else
          echo "=== gradle-wrapper.jar is invalid, downloading fresh copy ==="
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi
        chmod -R 755 gradle

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
