name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: Checkout
      uses: actions/checkout@v5

    # 2. 调试 gradlew 内容
    - name: Debug gradlew content
      run: |
        echo "=== gradlew content (first 5 lines) ==="
        head -5 gradlew
        echo "=== file type ==="
        file gradlew
        echo "=== ls -la before fix ==="
        ls -la gradlew gradle/wrapper/

    # 3. 设置 Java 环境
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    # 4. 修复 gradlew 换行符和权限
    - name: Fix gradlew permissions
      run: |
        echo "=== Fixing line endings ==="
        sed -i 's/\r$//' gradlew
        echo "=== Setting execute permission ==="
        chmod +x gradlew

    # 5. 修复 gradle wrapper 权限
    - name: Fix gradle wrapper permissions
      run: |
        echo "=== Setting wrapper permissions ==="
        chmod -R 755 gradle
        echo "=== ls -la after fix ==="
        ls -la gradlew gradle/wrapper/

    # 6. 构建 Debug APK
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # 7. 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
