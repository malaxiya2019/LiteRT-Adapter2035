name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    # 🔥 直接安装并使用 Gradle 8.2（完全绕过 wrapper）
    - name: Setup Gradle 8.2
      run: |
        echo "=== Downloading Gradle 8.2 ==="
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip
        echo "=== Adding Gradle to PATH ==="
        echo "$(pwd)/gradle-8.2/bin" >> $GITHUB_PATH
        
        # 验证
        gradle --version

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
